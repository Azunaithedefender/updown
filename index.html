<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EEF0EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121614" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hoch-Runter">

<link rel="icon" href="icon.svg" type="image/svg+xml">

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Hoch-Runter</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: eine Spalte fürs Handy, oben schmale Kopfzeile, unten feste Tab-Leiste; Karten nur für Übungen */
:root{
  --bg:#EEF0EC; --surface:#FFFFFF; --surface-2:#E3E7E1; --line:#CDD3CB;
  --fg:#1A1F1C; --muted:#5D6862; --accent:#1F4FD1; --accent-ink:#FFFFFF; --accent-soft:#DCE5FB;
  --good:#1E7A44; --good-soft:#DDF1E4; --warn:#9A6200; --warn-soft:#F8EBCB; --bad:#B3261E; --bad-soft:#F7DEDB;
  --plate-10:#1F4FD1; --plate-5:#1E7A44; --plate-2:#C98A00; --plate-1:#5D6862; --plate-05:#B3261E;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --radius:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121614; --surface:#1B201D; --surface-2:#252B28; --line:#343C38;
  --fg:#E7ECE8; --muted:#97A39C; --accent:#7C9DFF; --accent-ink:#0E1430; --accent-soft:#232E52;
  --good:#5CC88A; --good-soft:#18301F; --warn:#E4B04A; --warn-soft:#352A12; --bad:#F08A80; --bad-soft:#3A1E1B;
  --plate-10:#5F86F5; --plate-5:#3FA86C; --plate-2:#D9A324; --plate-1:#8A958F; --plate-05:#E06A5F;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121614; --surface:#1B201D; --surface-2:#252B28; --line:#343C38;
  --fg:#E7ECE8; --muted:#97A39C; --accent:#7C9DFF; --accent-ink:#0E1430; --accent-soft:#232E52;
  --good:#5CC88A; --good-soft:#18301F; --warn:#E4B04A; --warn-soft:#352A12; --bad:#F08A80; --bad-soft:#3A1E1B;
  --plate-10:#5F86F5; --plate-5:#3FA86C; --plate-2:#D9A324; --plate-1:#8A958F; --plate-05:#E06A5F;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 10px;border-bottom:1px solid var(--line);margin-bottom:16px}
.brand{white-space:nowrap;font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:.02em;text-transform:uppercase;line-height:1;display:flex;align-items:center;gap:8px}
.brand svg{width:26px;height:26px}
.top .sub{font-size:13px;color:var(--muted);text-align:right;white-space:nowrap}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:30px}
h2{font-size:22px;letter-spacing:.01em}
h3{font-size:18px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13px}
.stack{display:flex;flex-direction:column;gap:12px}
.stack-lg{display:flex;flex-direction:column;gap:24px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.num{font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.list > *{padding:12px 14px;border-top:1px solid var(--line)}
.list > *:first-child{border-top:0}
button,.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:10px 14px;min-height:44px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--accent);padding-inline:8px}
.btn-danger{color:var(--bad);border-color:var(--bad)}
.btn-block{width:100%}
.btn-sm{min-height:36px;padding:6px 10px;font-size:14px}
button:disabled{opacity:.45;cursor:default}
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:44px;width:100%}
textarea{min-height:120px;font-size:14px;line-height:1.4}
label.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:600}
label.field > input,label.field > select,label.field > textarea{font-weight:400}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--fg);white-space:nowrap}
.chip.up{background:var(--good-soft);color:var(--good)}
.chip.hold{background:var(--surface-2);color:var(--muted)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.down{background:var(--bad-soft);color:var(--bad)}
.chip.pr{background:var(--warn-soft);color:var(--warn)}
.seg{display:flex;background:var(--surface-2);border-radius:9px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;min-height:38px;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 10px;font-size:12px;font-weight:600;color:var(--muted);text-decoration:none}
nav.tabs a svg{width:24px;height:24px}
nav.tabs a[aria-current="page"]{color:var(--accent)}
/* Training */
.ex-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 14px 10px;display:flex;flex-direction:column;gap:10px}
.ex-card.done{border-color:var(--good)}
.ex-head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.ex-name{font-family:var(--display);font-size:21px;font-weight:700;line-height:1.1}
.ex-meta{font-size:13px;color:var(--muted)}
.last{font-size:13px;color:var(--muted);background:var(--surface-2);border-radius:8px;padding:6px 9px}
.sets{display:grid;grid-template-columns:28px minmax(0,1fr) minmax(0,1fr) minmax(0,.9fr) 46px;gap:6px;align-items:center}
.sets .h{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:center}
.sets .idx{font-family:var(--display);font-weight:700;font-size:18px;text-align:center;color:var(--muted)}
.sets input,.sets select{text-align:center;padding:6px 4px;font-variant-numeric:tabular-nums;font-size:17px}
.sets input::placeholder{color:var(--muted);opacity:.6}
.sets .tick{min-height:44px;padding:0;border-radius:8px}
.sets .tick[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:var(--bg)}
.sets .tag{grid-column:2 / -1;font-size:12px;color:var(--muted);margin-top:-4px}
.restbar{position:fixed;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom,0px));z-index:7;display:flex;justify-content:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.restbar .in{pointer-events:auto;max-width:608px;width:100%;background:var(--fg);color:var(--bg);border-radius:12px;padding:8px 8px 8px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.restbar .t{font-family:var(--display);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;min-width:70px}
.restbar button{background:transparent;color:var(--bg);border-color:color-mix(in srgb,var(--bg) 35%,transparent);min-height:38px;padding:6px 10px}
.hero-day{display:flex;flex-direction:column;gap:6px}
.hero-day .big{font-family:var(--display);font-size:40px;font-weight:700;line-height:1;text-transform:uppercase}
/* Plates */
.bar-vis{display:flex;align-items:center;height:84px;overflow-x:auto;padding:4px 0}
.bar-vis .shaft{height:10px;background:var(--muted);border-radius:3px;flex:0 0 40px}
.bar-vis .sleeve{height:14px;background:var(--muted);flex:0 0 10px;border-radius:2px}
.bar-vis .plate{border-radius:3px;margin-right:2px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:10px;font-weight:700;writing-mode:vertical-rl;flex:0 0 auto}
/* Chart */
.chart svg{display:block;width:100%;height:auto}
.chart .tip{font-size:13px;min-height:20px}
/* Intervall */
.ivbox{border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:2px;background:var(--surface-2);color:var(--fg)}
.ivbox[data-k="sprint"]{background:var(--bad);color:var(--bg)}
.ivbox[data-k="easy"]{background:var(--warn);color:var(--bg)}
.ivbox[data-k="jog"],.ivbox[data-k="warm"],.ivbox[data-k="cool"]{background:var(--good-soft);color:var(--good)}
.iv-label{font-family:var(--display);font-size:26px;font-weight:700;text-transform:uppercase;line-height:1.05}
.iv-sub{font-size:14px;font-weight:600;opacity:.85}
.iv-time{font-family:var(--display);font-size:72px;font-weight:700;line-height:1;margin-top:4px}
.iv-next{opacity:.85}
.iv-bar{height:6px;border-radius:3px;background:color-mix(in srgb,currentColor 20%,transparent);margin-top:8px;overflow:hidden}
.iv-bar i{display:block;height:100%;background:currentColor}
/* Volumen */
.vol{display:flex;flex-direction:column;gap:8px}
.vol-row{display:grid;grid-template-columns:82px minmax(0,1fr) 48px;gap:8px;align-items:center;font-size:14px}
.vol-track{position:relative;height:14px;background:var(--surface-2);border-radius:4px}
.vol-band{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--muted) 22%,transparent);border-radius:4px}
.vol-bar{position:absolute;left:0;top:3px;bottom:3px;border-radius:0 4px 4px 0;background:var(--good)}
.vol-bar.low{background:var(--warn)}.vol-bar.high{background:var(--bad)}
.vol-old{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--fg);opacity:.55}
.vol-done{position:absolute;top:50%;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:var(--fg);border:2px solid var(--surface)}
.vol-n{text-align:right;font-weight:600}
ol.rig{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
/* Kalender */
.cal{display:flex;flex-direction:column;gap:2px}
.cal-row{display:grid;grid-template-columns:repeat(7,minmax(0,1fr)) 34px;gap:2px;align-items:stretch}
.cal-head div{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:center;padding:4px 0}
.cal-cell{position:relative;min-height:50px;padding:4px 2px;border-radius:8px;border:1px solid transparent;background:var(--surface);display:flex;flex-direction:column;align-items:center;gap:0;font-weight:500}
.cal-cell.other{opacity:.4}
.cal-cell.is-today{border-color:var(--accent)}
.cal-cell.sel{background:var(--accent-soft);border-color:var(--accent)}
.cal-cell.inr{background:var(--warn-soft)}
.cal-n{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.cal-m{font-size:18px;line-height:1.2;font-weight:700;min-height:22px}
.cal-pr{position:absolute;top:2px;right:4px;font-size:10px;color:var(--warn)}
.cal-sum{font-size:11px;color:var(--muted);display:flex;align-items:center;justify-content:center}
.cal-sum.ok{color:var(--good);font-weight:700}
.cal-bars{margin-top:-1px}
.cal-bar{min-height:18px;padding:0 6px;border:0;border-radius:4px;color:var(--bg);font-size:11px;font-weight:600;justify-content:flex-start;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-legend{display:flex;flex-wrap:wrap;gap:4px 12px}
/* misc */
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));z-index:20;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;max-width:calc(100% - 32px)}
details summary{cursor:pointer;font-weight:600;list-style:none;min-height:36px;display:flex;align-items:center}
details summary::-webkit-details-marker{display:none}
table.hist{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
table.hist td,table.hist th{padding:7px 6px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
table.hist th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-top:0}
.scroll-x{overflow-x:auto}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.confirm{background:var(--bad-soft);border-radius:8px;padding:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ok-box{background:var(--good-soft);color:var(--good);border-radius:8px;padding:10px 12px;font-weight:600}
.warn-box{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:10px 12px}
.change{display:flex;gap:10px;align-items:flex-start}
.change input{width:22px;min-height:22px;height:22px;margin-top:2px;flex:0 0 22px}
@media (prefers-reduced-motion:no-preference){.ex-card,.tick{transition:border-color .2s,background .2s}}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand" aria-label="Hoch-Runter">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="9" width="5" height="14" rx="1.5" fill="var(--accent)"/><rect x="25" y="9" width="5" height="14" rx="1.5" fill="var(--accent)"/><rect x="7" y="12" width="3" height="8" rx="1" fill="var(--fg)"/><rect x="22" y="12" width="3" height="8" rx="1" fill="var(--fg)"/><rect x="10" y="14.5" width="12" height="3" rx="1" fill="var(--fg)"/></svg>
      Hoch-Runter
    </div>
    <div class="sub" id="topsub"></div>

  <main id="view" aria-live="polite"></main>
</div>
<div class="restbar" id="restbar" hidden><div class="in"><div class="t" id="restt">0:00</div><div class="grow small">Pause</div><button id="rest-m">−15</button><button id="rest-p">+15</button><button id="rest-x">Fertig</button></div></div>
<nav class="tabs" aria-label="Bereiche"><div class="in">

  <a href="#plan" data-tab="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="4" width="16" height="17" rx="2"/><path d="M8 2v4M16 2v4M8 11h8M8 15h5"/></svg>Plan</a>
  <a href="#coach" data-tab="coach"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12h5"/></svg>Coach</a>
  <a href="#mehr" data-tab="mehr"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>Mehr</a>

<script>
'use strict';
const APP_VERSION = '1.0.0';
const DAYNAMES = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];

/* ---------- Katalog & Vorgaben ---------- */
const EQUIP = {
  ez:     {label:'EZ-Stange', hint:'Gesamtgewicht inkl. Stange', weighted:true},
  db2:    {label:'2 Kurzhanteln', hint:'Scheiben pro Hantel', weighted:true},
  db1:    {label:'1 Kurzhantel', hint:'Scheiben auf der Hantel', weighted:true},
  belt:   {label:'Gürtel/Kette', hint:'Zusatzgewicht', weighted:true},
  bw:     {label:'Körpergewicht', hint:'nur Wiederholungen', weighted:false},
  roller: {label:'Wrist Roller', hint:'Gewicht am Band', weighted:true},
  grip:   {label:'Gummigriff-Hantel', hint:'Scheiben, pro Hand', weighted:true},
  free:   {label:'Frei', hint:'Gewicht wie notiert', weighted:true},
  none:   {label:'Ohne', hint:'nur Notiz', weighted:false},
  run:    {label:'Laufen', hint:'Intervalle', weighted:false},
};
const DEFAULT_EXERCISES = [
 ['flat_press','Flat Chest Press','db2','reps','Brust'],
 ['incline_press','Incline Chest Press','db2','reps','Brust'],
 ['db_fly','DB Flys','db2','reps','Brust'],
 ['pushups','Push-Ups','bw','reps','Brust'],
 ['deficit_pu','Deficit Push-Ups','bw','reps','Brust'],
 ['archer_pu','Archer Push-Ups','bw','reps','Brust'],
 ['dips','Dips','bw','reps','Trizeps'],
 ['y_raise','Y Shoulder Raise','db2','reps','Schulter'],
 ['upright_row','Upright Row','db2','reps','Schulter'],
 ['shoulder_press_ez','Shoulder Press EZ','ez','reps','Schulter'],
 ['skullcrusher','Skullcrushers','ez','reps','Trizeps'],
 ['triceps_ext','Trizeps Extensions','ez','reps','Trizeps'],
 ['weighted_pullup','Weighted Pull-Ups','belt','reps','Rücken'],
 ['pullup','Pull-Ups','bw','reps','Rücken'],
 ['single_row','Single Arm Row','db1','reps','Rücken'],
 ['standing_row','Standing Row','ez','reps','Rücken'],
 ['straight_curl','Straight Arm Curls','db2','reps','Bizeps'],
 ['curl_db','Regular Curls DB','db2','reps','Bizeps'],
 ['curl_ez','Regular Curls EZ','ez','reps','Bizeps'],
 ['drag_curl_db','Drag Curls DB','db2','reps','Bizeps'],
 ['drag_curl_ez','Drag Curls EZ','ez','reps','Bizeps'],
 ['myo_curl','Myo-Rep Curls','ez','reps','Bizeps'],
 ['hammer','Hammer Curls','ez','reps','Bizeps'],
 ['preacher','Preacher Curls','free','reps','Bizeps'],
 ['dragon_flag','Dragon Flags','bw','reps','Core'],
 ['situp_drop','Sit-up Drop Set','free','reps','Core'],
 ['deep_squat','Deep Squats','ez','reps','Beine'],
 ['back_lunge','Back Lunges','db2','reps','Beine'],
 ['sldl','Stiff-Leg Deadlifts','ez','reps','Beine'],
 ['deadlift','Deadlifts','ez','reps','Beine'],
 ['calf','Calf Raises','ez','reps','Waden'],
 ['wrist_curl','Wrist Curls KH','db2','reps','Unterarme'],
 ['wrist_curl_ez','Wrist Curls EZ','ez','reps','Unterarme'],
 ['roller_ext','Wrist Roller Extension','roller','reps','Unterarme'],
 ['pronation','Pronation (Band)','roller','reps','Unterarme'],
 ['radial','Radialabduktion / Rising','roller','reps','Unterarme'],
 ['grip_hold','Grip Hold (Gummigriff)','grip','sec','Unterarme'],
 ['sprints','Intervall-Sprints','run','interval','Cardio'],

/* ---------- Speicher (IndexedDB, Fallback localStorage) ---------- */
const Store = {
  db:null,
  async open(){
    if(this.db) return this.db;
    this.db = await new Promise((res,rej)=>{
      try{const r=indexedDB.open('hoch-runter',1);
        r.onupgradeneeded=()=>r.result.createObjectStore('kv');
        r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);}catch(e){rej(e);}
    });
    return this.db;
  },
  async get(k){
    try{const db=await this.open();return await new Promise((res,rej)=>{const t=db.transaction('kv').objectStore('kv').get(k);t.onsuccess=()=>res(t.result);t.onerror=()=>rej(t.error);});}
    catch(e){try{const v=localStorage.getItem('hr-'+k);return v?JSON.parse(v):undefined;}catch(_){return undefined;}}
  },
  async set(k,v){
    try{const db=await this.open();await new Promise((res,rej)=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=res;tx.onerror=()=>rej(tx.error);});return true;}
    catch(e){try{localStorage.setItem('hr-'+k,JSON.stringify(v));return true;}catch(_){return false;}}
  }
};

function migrate(st){
  const d=defaultState();

  for(const e of d.exercises) if(!st.exercises.find(x=>x.id===e.id)) st.exercises.push({...e});
  if(st.templates && !(st.plans&&st.plans.length&&st.plans!==d.plans)){
    const first=st.sessions.length?[...st.sessions].sort((a,b)=>a.date<b.date?-1:1)[0].date:todayISO();
    const hasImport=st.sessions.some(s=>s.imported);
    st.plans=[newPlanObj('Split 6 Tage',hasImport?'import':'vorgabe',st.templates,'active',first)];
  }
  delete st.templates;
  const ap=st.plans.find(p=>p.status==='active')||st.plans[0];
  for(const s of st.sessions) if(!s.plan){s.plan=ap.id;s.planRev=1;}
  if(st.active&&!st.active.plan){st.active.plan=ap.id;}
  if(!st.plans.some(p=>p.preset)){const pp=st.plans.filter(p=>p.status!=='draft').sort((a,b)=>(a.periods[0]?.from||a.created)<(b.periods[0]?.from||b.created)?-1:1)[0];if(pp)pp.preset=true;}
  st.fixes=st.fixes||{};
  if(!st.fixes.wrist){ // Wrist Curls: Kurzhantel und EZ getrennt
    const w=st.exercises.find(e=>e.id==='wrist_curl'); if(w){w.name='Wrist Curls KH';w.equip='db2';}
    for(const s of st.sessions) for(const e of s.entries) if(e.ex==='wrist_curl'&&e.sets.some(x=>(x.w||0)>15)) e.ex='wrist_curl_ez';
    for(const p of st.plans) if(p.preset&&p.rev===1) for(const t of p.templates) for(const i of t.items) if(i.ex==='wrist_curl'){i.ex='wrist_curl_ez';i.repMin=8;}
    st.fixes.wrist=true;
  }
  if(!st.fixes.skips){ // Importierte Krank-/Urlaubstage als Ausfall führen
    st.skips=st.skips||[];
    st.sessions=st.sessions.filter(s=>{
      if(!s.imported||s.entries.some(e=>e.sets.length||e.ex==='sprints')) return true;
      const r=/krank/i.test(s.notes)?'Krank':/urlaub(?!straining)/i.test(s.notes)?'Urlaub':null; if(!r) return true;
      if(st.skips.some(k=>k.date===s.date)) return false;
      st.skips.push({id:uid(),date:s.date,template:s.template,plan:s.plan,reason:r,note:s.notes}); return false;});
    st.fixes.skips=true;

  if(!st.fixes.cues){const C={roller_ext:'Handflächen nach unten, Gewicht über die Handgelenke hochrollen (Unterarm-Strecker).',pronation:'Band um die Hand, Austritt auf der Daumenseite. Unterarm von außen nach innen drehen (Armwrestling-Pronation).',radial:'Band um die Faust, Daumen oben, Handfläche senkrecht. Hand Richtung „Daumen hoch“ bewegen (Radialabduktion).',situp_drop:'Rücken leicht erhöht auf Puzzlematten. Je Runde: max. Wdh mit 10 kg → 5 kg → Körpergewicht, dann 1–2 min Pause. 4 Runden.',grip_hold:'Gummigriff-Hantel mit ca. 50 kg, links und rechts je so lange wie möglich halten (Ziel 20 s+).',calf:'Auf den Korkkeilen, EZ-Stange maximal beladen.',sprints:'Die ersten 2 Intervalle mit 50 % Tempo zum Aufwärmen.'};
    for(const e of st.exercises) if(C[e.id]&&!e.cue) e.cue=C[e.id]; st.fixes.cues=true;}
  if(!st.fixes.ladder){const L={pushups:'deficit_pu',deficit_pu:'archer_pu',pullup:'weighted_pullup'};for(const e of st.exercises) if(L[e.id]&&e.next===undefined) e.next=L[e.id];st.fixes.ladder=true;}
  st.bodyweights=st.bodyweights||[]; if(st.settings.bodyweight&&!st.bodyweights.length) st.bodyweights.push({date:todayISO(),kg:st.settings.bodyweight});
  // Datenkorrektur: 01.10. war ein Deep-Squat-Test, keine Lunges
  for(const s of st.sessions) if(s.imported) for(const e of s.entries) if(e.ex==='back_lunge'&&e.sets.length&&e.sets.every(x=>(x.w||0)>=40)){e.ex='deep_squat';e.variant='Test';}
  return st;

/* ---------- Domäne ---------- */
const exById = id => S.exercises.find(e=>e.id===id) || {id,name:id,equip:'free',unit:'reps',group:'Sonstiges'};
function exByName(name){const n=String(name||'').trim().toLowerCase();return S.exercises.find(e=>e.name.toLowerCase()===n)||S.exercises.find(e=>e.id===n);}
function increment(ex){return ({ez:1,db2:1,db1:1,belt:1,roller:0.5,grip:1,free:1})[ex.equip]||1;}
function effLoad(ex,w){
  const E=S.equipment; if(w==null) w=0;
  switch(ex.equip){case 'db2':case 'db1':return w+E.dbHandle; case 'grip':return w+E.gripHandle; case 'belt':return (S.settings.bodyweight||0)+w; case 'bw':return S.settings.bodyweight||0; default:return w;}
}
function e1rm(ex,set){
  if(!set||!set.r||set.t==='myo') return null;
  if(ex.unit!=='reps') return null;
  const L=effLoad(ex,set.w); if(!L) return null;
  const reps=Math.min(set.r,30);
  return L*(1+reps/30);
}
function workSets(entry){return (entry.sets||[]).filter(s=>s.r!=null&&s.t!=='myo'&&s.t!=='warm');}
function sessionsSorted(){return [...S.sessions].sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);}
function historyFor(exId){
  const out=[];
  for(const s of sessionsSorted()) for(const e of s.entries) if(e.ex===exId && ((e.sets||[]).length||e.iv)) out.push({date:s.date,session:s,entry:e});
  return out;
}
function bestOf(ex,entry){
  if(entry.iv) return {metric:ivSprintSec(entry.iv),set:null};
  const ws=workSets(entry); if(!ws.length) return null;
  let best=null;
  for(const s of ws){
    const v = EQUIP[ex.equip].weighted && ex.unit==='reps' ? e1rm(ex,s) : s.r;
    const metric = v ?? s.r;
    if(best==null||metric>best.metric) best={metric,set:s};
  }
  return best;
}
function metricLabel(ex){if(ex.unit==='interval')return 'Sprintzeit (s)';return EQUIP[ex.equip].weighted && ex.unit==='reps' ? 'geschätztes 1RM (kg)' : ex.unit==='sec' ? 'beste Haltezeit (s)' : 'beste Wiederholungen';}
/* Progressionsempfehlung (Doppelte Progression) */
function suggestBase(exId,item){
  const ex=exById(exId); if(ex.unit==='interval') return suggestInterval(exId,item);
  const H=historyFor(exId).filter(h=>!h.session.deload);
  if(ex.unit==='note'||!H.length) return null;
  const last=H[H.length-1]; const ws=workSets(last.entry); if(!ws.length) return null;
  const repMin=item?.repMin||0, repMax=item?.repMax||0;
  const weighted=EQUIP[ex.equip].weighted;
  const w=Math.max(...ws.map(s=>s.w??0));
  const top=ws.filter(s=>(s.w??0)===w);
  const allTop = repMax>0 && top.length>=Math.min(item?.sets||2,2) && top.every(s=>s.r>=repMax);
  const anyLow = repMin>0 && top.some(s=>s.r<repMin && (s.rir??0)<=0);
  // Stagnation: letzte 4 vs. 4 davor
  let stagnant=false;
  if(H.length>=8){const b=H.map(h=>bestOf(ex,h.entry)?.metric||0);const recent=Math.max(...b.slice(-4));const before=Math.max(...b.slice(-8,-4));stagnant=recent<=before;}
  let r;
  const pause=daysBetween(last.date,todayISO());
  if(pause>=10 && weighted && w>0){
    const inc=increment(ex); const back=Math.max(0,Math.round(w*0.9/inc)*inc);
    return {kind:'hold',text:`${pause} Tage seit der letzten Einheit. Zum Wiedereinstieg mit ca. 90 % starten (${fmt(back,2)} kg) und in 1–2 Einheiten zurück auf ${fmt(w,2)} kg.`,short:`Wiedereinstieg ${fmt(back,2)} kg`,target:back};
  }
  if(allTop){
    if(!weighted){r={kind:'up',text:'Obere Grenze erreicht: schwerere Variante oder Zusatzgewicht',short:'Variante ↑'};}
    else{
      const next=w+increment(ex);
      if(ex.equip==='ez' && next>S.equipment.ezMax){
        r={kind:'warn',text:`EZ-Limit ${fmt(S.equipment.ezMax)} kg erreicht. Mach es anders schwerer: langsames Tempo (3 s ab), Pause unten, einseitige Variante oder Rep-Range nach oben verschieben.`,short:'Limit: Tempo/Variante'};
      } else r={kind:'up',text:`Alle Sätze ≥ ${repMax} Wdh. Nächstes Mal ${fmt(next,2)} kg${ex.equip==='db2'||ex.equip==='db1'?' (Scheiben)':''}.`,short:`↑ ${fmt(next,2)} kg`,target:next};
    }
  } else if(anyLow){
    const prev=H.length>=2?workSets(H[H.length-2].entry):[];
    const prevLow = prev.length && prev.filter(s=>(s.w??0)===w).some(s=>s.r<repMin&&(s.rir??0)<=0);
    if(prevLow && weighted){const lower=Math.max(0,w-increment(ex)*2);r={kind:'down',text:`Zweimal unter ${repMin} Wdh bei 0 RIR. Gewicht auf ${fmt(lower,2)} kg senken und wieder hocharbeiten.`,short:`↓ ${fmt(lower,2)} kg`,target:lower};}
    else r={kind:'hold',text:`Unter ${repMin} Wdh. Gewicht halten, auf Schlaf und Pausen achten.`,short:'Halten'};
  } else {
    r={kind:'hold',text:weighted?`Bei ${fmt(w,2)} kg bleiben, Ziel: +1 Wdh im ersten Satz.`:'Ziel: +1 Wdh im ersten Satz.',short:weighted?`= ${fmt(w,2)} kg, +1 Wdh`:'+1 Wdh'};
  }
  if(stagnant && r.kind!=='up') r.stagnant=true;
  if(item?.targetW!=null && r.kind!=='up' && r.kind!=='down'){r.coach=item.targetW;}
  return r;
}

/* Scheibenrechner */
function plateSolve(perSide, inventory, sides){
  // inventory: {weight:count} gesamt; benötigt pro Gewicht 'sides' Stück je Scheibe
  const ws=Object.keys(inventory).map(Number).sort((a,b)=>b-a);
  let rest=Math.round(perSide*100)/100; const used=[];
  for(const p of ws){let n=Math.floor((inventory[p]||0)/sides);while(n>0&&rest+1e-9>=p){used.push(p);rest=Math.round((rest-p)*100)/100;n--;}}
  return {used,rest};
}

function parseCoachReply(text){
  const blocks=[...String(text).matchAll(/```(?:json)?\s*([\s\S]*?)```/g)].map(m=>m[1]);
  if(!blocks.length){const i=text.indexOf('{'),j=text.lastIndexOf('}');if(i>=0&&j>i)blocks.push(text.slice(i,j+1));}
  for(const b of blocks.reverse()){try{const o=JSON.parse(b);if(o&&(Array.isArray(o.changes)||(o.plan&&Array.isArray(o.plan.days)))){o.changes=o.changes||[];return o;}}catch(e){}}

function templateByDay(day,list){
  list=list||tpls();
  const d=String(day||'').trim().toLowerCase();
  const wd=DAYNAMES.findIndex(n=>n.toLowerCase()===d||n.toLowerCase().slice(0,2)===d.slice(0,2));
  return list.find(t=>t.weekday===wd)||list.find(t=>t.name.toLowerCase()===d);
}
function describeChange(c,list){
  const t=templateByDay(c.day,list); const ex=exByName(c.exercise);
  const where=t?`${DAYNAMES[t.weekday]}`:`? (${c.day||'kein Tag'})`;
  const parts=[];
  if(c.sets!=null)parts.push(c.sets+' Sätze');
  if(c.repMin!=null||c.repMax!=null)parts.push(`${c.repMin??'?'}–${c.repMax??'?'} Wdh`);
  if(c.targetWeight!=null)parts.push(fmt(c.targetWeight,2)+' kg');
  let txt;
  switch(c.action){
    case 'update':txt=`${where}: ${c.exercise} → ${parts.join(', ')||'Notiz'}`;break;
    case 'replace':txt=`${where}: ${c.exercise} ersetzen durch ${c.with}`;break;
    case 'add':txt=`${where}: ${c.exercise} hinzufügen${parts.length?' ('+parts.join(', ')+')':''}`;break;
    case 'remove':txt=`${where}: ${c.exercise} entfernen`;break;
    default:txt=`Unbekannte Aktion: ${c.action}`;
  }
  let problem=null;
  if(!t) problem='Tag nicht gefunden';
  else if(c.action!=='add' && !(ex&&t.items.find(i=>i.ex===ex.id))) problem='Übung an diesem Tag nicht gefunden';
  return {txt:txt+(c.note?` – ${c.note}`:''),problem};
}
function applyChange(c,list){
  const t=templateByDay(c.day,list); if(!t) return false;
  const ensureEx=(name,equip)=>{let ex=exByName(name);if(!ex){ex={id:'x_'+uid(),name:String(name).trim(),equip:EQUIP[equip]?equip:'free',unit:'reps',group:'Sonstiges'};S.exercises.push(ex);}return ex;};
  const ex=exByName(c.exercise);
  const patch=i=>{if(c.sets!=null)i.sets=+c.sets;if(c.repMin!=null)i.repMin=+c.repMin;if(c.repMax!=null)i.repMax=+c.repMax;if(c.targetWeight!=null)i.targetW=+c.targetWeight;if(c.note)i.note=c.note;};
  if(c.action==='update'){const i=ex&&t.items.find(i=>i.ex===ex.id);if(!i)return false;patch(i);return true;}
  if(c.action==='remove'){const k=ex?t.items.findIndex(i=>i.ex===ex.id):-1;if(k<0)return false;t.items.splice(k,1);return true;}
  if(c.action==='replace'){const i=ex&&t.items.find(i=>i.ex===ex.id);if(!i)return false;const nx=ensureEx(c.with,c.equipment);i.ex=nx.id;delete i.targetW;patch(i);return true;}
  if(c.action==='add'){const nx=ensureEx(c.exercise,c.equipment);const i={ex:nx.id,sets:c.sets??3,repMin:c.repMin??8,repMax:c.repMax??12,note:c.note||''};if(c.targetWeight!=null)i.targetW=+c.targetWeight;t.items.push(i);return true;}
  return false;
}

function importData(obj){
  if(!obj||typeof obj!=='object') throw new Error('Keine gültige Datei.');
  if(obj.format==='hoch-runter-backup'){
    if(!obj.state||!Array.isArray(obj.state.sessions)) throw new Error('Backup ist beschädigt.');
    S=migrate(obj.state); return {mode:'restore',sessions:S.sessions.length};
  }
  if(obj.format==='hoch-runter-import'){
    for(const e of obj.exercises||[]) if(!S.exercises.find(x=>x.id===e.id)) S.exercises.push(e);
    let n=0; const ids=new Set(S.sessions.map(s=>s.id));
    const AP=activePlan(); const dates=(obj.sessions||[]).map(s=>s.date).sort();
    if(AP && dates.length && !S.sessions.length){AP.source='import';if(AP.periods[0])AP.periods[0].from=dates[0];const l0=AP.log.find(l=>l.rev===1);if(l0){l0.date=dates[0];l0.text='Aus Google Sheet übernommen';}}
    for(const s of obj.sessions||[]){ if(ids.has(s.id)) continue;
      const P=S.plans.find(p=>p.source==='import')||activePlan(); const t=P.templates.find(t=>t.weekday===dDate(s.date).getDay()); if(t) s.template=t.id; s.plan=P.id; s.planRev=1;
      S.sessions.push(s); n++; }
    S.fixes.skips=false; S.fixes.wrist=false; S.fixes.iv=false; S=migrate(S); upgradeIntervals();
    return {mode:'merge',sessions:n};
  }
  throw new Error('Unbekanntes Dateiformat.');
}

/* ---------- Pläne & Versionen ----------
   Regeln: Ein aktiver oder archivierter Plan wird nie überschrieben.
   Jede Änderung entsteht als Entwurf. Beim Übernehmen wird die alte Fassung als Version gesichert
   (Plan-Version) oder der neue Plan aktiviert und der alte archiviert. Löschen geht nur bei Entwürfen. */
const clone = o => JSON.parse(JSON.stringify(o));
function newPlanObj(name,source,templates,status,from){
  return {id:'p_'+uid(),name,source,status,created:todayISO(),periods:status==='active'?[{from:from||todayISO(),to:null}]:[],
    rev:1,templates,revisions:[],log:[{date:from||todayISO(),rev:1,text:source==='import'?'Aus Google Sheet übernommen':source==='coach'?'Vom Coach vorgeschlagen':'Plan angelegt'}],reason:''};
}
function activePlan(){return S.plans.find(p=>p.status==='active')||S.plans.find(p=>p.status!=='draft');}
function tpls(){return activePlan()?.templates||[];}
function planOf(s){return S.plans.find(p=>p.id===s?.plan);}
function currentPeriod(p){return p&&p.periods.length?p.periods[p.periods.length-1]:null;}
function tplOf(s){
  if(!s||!s.template) return null;
  const P=planOf(s);
  if(P){const t=P.templates.find(t=>t.id===s.template);if(t)return t;for(const r of P.revisions){const x=r.templates.find(t=>t.id===s.template);if(x)return x;}}
  for(const p of S.plans){const t=p.templates.find(t=>t.id===s.template);if(t)return t;}
  return s.tplName?{id:s.template,name:s.tplName,weekday:dDate(s.date).getDay(),items:[]}:null;
}
const SOURCE_LABEL={import:'Import',vorgabe:'Vorgabe',manuell:'Selbst erstellt',coach:'Coach'};
const STATUS_LABEL={active:'Aktiv',archived:'Archiv',draft:'Entwurf'};

/* Entwürfe */
function makeDraft(mode,base,templates,extra){
  // mode 'revise': ändert base als neue Version; mode 'new': eigener neuer Plan
  const ts=clone(templates||base?.templates||[]);
  if(mode==='new') ts.forEach(t=>t.id='t_'+uid());
  const d={id:'p_'+uid(),name:mode==='revise'?base.name:(extra?.name||(base?base.name+' (neu)':'Neuer Plan')),source:extra?.source||'manuell',status:'draft',created:todayISO(),periods:[],rev:1,templates:ts,revisions:[],log:[],reason:extra?.reason||'',
    draft:{mode,baseId:base?.id||null,baseRev:base?.rev||null}};
  S.plans.push(d); return d;
}

function edT(){return editDraft()?.templates||[];}

/* Vergleich zweier Pläne, Tag für Tag */
function itemSig(i){return `${i.sets}|${i.repMin}|${i.repMax}|${i.targetW??''}|${i.note||''}|${i.proto?JSON.stringify(i.proto):''}`;}
function diffPlans(oldT,newT){
  const days=[1,2,3,4,5,6,0]; const out=[]; let changes=0;
  for(const wd of days){
    const a=(oldT||[]).filter(t=>t.weekday===wd), b=(newT||[]).filter(t=>t.weekday===wd);
    if(!a.length&&!b.length) continue;
    const A=a[0],B=b[0]; const rows=[];
    const ai=A?A.items:[], bi=B?B.items:[];
    for(const i of bi){const o=ai.find(x=>x.ex===i.ex);
      if(!o){rows.push({k:'add',i});changes++;}
      else if(itemSig(o)!==itemSig(i)){rows.push({k:'chg',i,o});changes++;}
      else rows.push({k:'same',i});}
    for(const o of ai) if(!bi.find(x=>x.ex===o.ex)){rows.push({k:'del',i:o});changes++;}
    let head='same';
    if(!A){head='add';changes++;} else if(!B){head='del';changes++;} else if(A.name!==B.name){head='ren';changes++;}
    out.push({wd,A,B,head,rows});
  }
  return {days:out,changes};
}
function diffSummary(d){
  const n={add:0,del:0,chg:0};d.days.forEach(x=>x.rows.forEach(r=>{if(n[r.k]!=null)n[r.k]++;}));
  const p=[];if(n.add)p.push(`${n.add} neu`);if(n.chg)p.push(`${n.chg} geändert`);if(n.del)p.push(`${n.del} entfernt`);
  return p.join(', ')||'keine Übungsänderungen';
}

/* Übernehmen */
function commitRevision(draft,text){
  const P=S.plans.find(p=>p.id===draft.draft.baseId); if(!P) return false;
  const dsum=diffSummary(diffPlans(P.templates,draft.templates));
  P.revisions.push({rev:P.rev,date:todayISO(),name:P.name,templates:clone(P.templates)});
  P.templates=clone(draft.templates); P.rev++;
  if(draft.name&&draft.name!==P.name) P.name=draft.name;
  P.log.push({date:todayISO(),rev:P.rev,text:(text||draft.reason||'Plan angepasst')+' ('+dsum+')',source:draft.source});
  S.plans=S.plans.filter(p=>p!==draft); return P;
}
function activatePlan(P,reasonText){
  const today=todayISO(); const cur=activePlan();
  if(cur&&cur!==P&&cur.status==='active'){cur.status='archived';const pr=currentPeriod(cur);if(pr&&!pr.to)pr.to=addDays(today,-1)<pr.from?today:addDays(today,-1);cur.log.push({date:today,rev:cur.rev,kind:'status',text:`Archiviert, ersetzt durch „${P.name}“`});}
  const wasDraft=P.status==='draft';
  P.status='active'; P.periods.push({from:today,to:null});
  if(wasDraft){delete P.draft;P.log.push({date:today,rev:P.rev,text:(reasonText||P.reason||'Plan aktiviert'),source:P.source});}
  else P.log.push({date:today,rev:P.rev,kind:'status',text:'Wieder aktiviert'});
  return P;
}
/* Löschen: nur archivierte Pläne ohne Grundplan-Markierung. Einheiten bleiben vollständig erhalten. */
function canDeletePlan(P){return P.status==='archived'&&!P.preset&&!(S.breaks||[]).some(b=>b.altPlan===P.id&&b.to>=todayISO());}
function deletePlan(P){
  if(!canDeletePlan(P)) return false;
  for(const s of S.sessions) if(s.plan===P.id){const t=tplOf(s);if(t)s.tplName=t.name;s.planName=P.name;s.plan=null;}
  S.plans=S.plans.filter(p=>p!==P); return true;
}
/* Coach: kompletter Plan → Entwurf */
function draftFromCoachPlan(obj){
  const plan=obj.plan||obj; const ts=[];
  for(const day of plan.days||[]){
    const wd=DAYNAMES.findIndex(n=>n.toLowerCase()===String(day.day||'').trim().toLowerCase());
    if(wd<0) continue;
    const t={id:'t_'+uid(),name:day.name||DAYNAMES[wd],weekday:wd,items:[]};
    for(const x of day.exercises||[]){
      let ex=exByName(x.exercise);
      if(!ex){ex={id:'x_'+uid(),name:String(x.exercise).trim(),equip:EQUIP[x.equipment]?x.equipment:'free',unit:x.unit==='sec'?'sec':'reps',group:GROUPS.includes(x.group)?x.group:'Sonstiges'};S.exercises.push(ex);}
      const it={ex:ex.id,sets:+x.sets||3,repMin:+x.repMin||8,repMax:+x.repMax||12,note:x.note||''};if(x.targetWeight!=null)it.targetW=+x.targetWeight;t.items.push(it);
    }
    ts.push(t);
  }
  if(!ts.length) return null;
  const d=makeDraft('new',null,ts,{name:plan.name||'Coach-Plan',source:'coach',reason:plan.reason||obj.summary||''});
  d.templates=ts; return d;
}

function dayPlan(d){
  const brk=breakOn(d); const dow=dDate(d).getDay();
  if(brk&&brk.kind==='frei') return {brk,tpls:[],movedOut:null,plan:null};
  const plan=brk&&brk.kind==='alt'?(S.plans.find(p=>p.id===brk.altPlan)||activePlan()):activePlan();
  const movedOut=(S.moves||[]).find(m=>m.from===d);
  const tpls=[];
  const own=plan?.templates.find(t=>t.weekday===dow);
  if(own&&!(movedOut&&movedOut.tpl===own.id)) tpls.push(own);
  for(const m of (S.moves||[]).filter(m=>m.to===d)){const f=findTpl(m.tpl);if(f&&!tpls.includes(f.t))tpls.push(Object.assign(Object.create(f.t),{_move:m}));}
  return {brk,tpls,movedOut,plan};
}

/* ---------- Intervalltraining (Mittwoch) ---------- */
const DEFAULT_PROTO={warm:5,cool:5,rounds:12,work:25,rest:35,easy:2,easyPct:50};

function protoOf(item){return {...DEFAULT_PROTO,...(item?.proto||{})};}
function protoMin(p){return p.warm+p.cool+p.rounds*(p.work+p.rest)/60;}
function protoStr(p){return `${p.warm} min Einlaufen · ${p.rounds}× (${p.work} s Sprint / ${p.rest} s Joggen)${p.easy?`, davon ${p.easy} locker (${p.easyPct} %)`:''} · ${p.cool} min Auslaufen = ${fmt(protoMin(p))} min`;}

function ivSprintSec(iv){const r=iv.done??iv.rounds;return Math.max(0,r-(iv.easy||0))*iv.work;}
function ivPhases(p){

    const easy=i<=p.easy;

/* Timer: zeitbasiert, übersteht Neuladen (Zustand in S.active.ivt) */
let ivIv=null, ivLast=-1, audio=null, wake=null;

function ivLocate(ph,el){let acc=0;for(let i=0;i<ph.length;i++){if(el<acc+ph[i].dur)return {i,left:acc+ph[i].dur-el,acc};acc+=ph[i].dur;}return {i:ph.length,left:0,acc};}
function beep(freq,ms){try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=freq;o.connect(g);g.connect(audio.destination);g.gain.setValueAtTime(.25,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+ms/1000);o.start();o.stop(audio.currentTime+ms/1000);}catch(e){}}
function ivEntry(){return S.active?.entries[S.active.ivt?.ei];}

}
function ivPause(){const t=S.active?.ivt;if(t&&!t.pausedAt){t.pausedAt=Date.now();save();}clearInterval(ivIv);ivIv=null;try{wake&&wake.release();}catch(e){}render();}

function ivRun(){clearInterval(ivIv);ivLast=-1;ivIv=setInterval(ivTick,250);ivTick();}
function ivTick(){

    const e=ivEntry(); if(e){const r=ph[L.i].round; if(r&&ph[L.i].k!=='jog') e.iv.done=Math.max(0,r-1); else if(r) e.iv.done=r; if(ph[L.i].k==='cool') e.iv.done=t.proto.rounds;}

function suggestInterval(exId,item){

/* Altdaten: Mittwochs-Notizen in Intervall-Daten umwandeln */

/* Lesbare Schreibweise */
function rirStr(v){if(v==null)return '';const lo=Math.floor(v),hi=Math.ceil(v);return lo===hi?String(lo):`${lo}–${hi}`;}
function rirRange(sets){const v=sets.map(s=>s.rir).filter(x=>x!=null);if(!v.length)return '';const lo=Math.floor(Math.min(...v)),hi=Math.ceil(Math.max(...v));return lo===hi?String(lo):`${lo}–${hi}`;}
function wStr(ex,w){return `${fmt(w,2)} kg`;}
function setStr(ex,s){
  const r=s.r==null?'?':fmt(s.r); const unit=ex.unit==='sec'?' s':(EQUIP[ex.equip].weighted?'':' Wdh');
  const rir=s.rir!=null?` · RIR ${rirStr(s.rir)}`:'';
  if(EQUIP[ex.equip].weighted&&s.w!=null) return `${wStr(ex,s.w)} × ${r}${ex.unit==='sec'?' s':''}${rir}`;
  return `${r}${unit}${rir}`;
}
function entryStr(ex,e){
  if(e.iv) return ivStr(e.iv);
  const sets=e.sets||[]; if(!sets.length) return '';
  const main=sets.filter(s=>s.t!=='myo'), myo=sets.filter(s=>s.t==='myo');
  const weighted=EQUIP[ex.equip].weighted; const u=ex.unit==='sec'?' s':(weighted?'':' Wdh');
  let out;
  const ws=[...new Set(main.map(s=>s.w??null))];
  if(weighted&&ws.length===1&&ws[0]!=null) out=`${wStr(ex,ws[0])} × ${main.map(s=>fmt(s.r)).join(' / ')}${ex.unit==='sec'?' s':''}`;
  else if(weighted) out=main.map(s=>s.w!=null?`${wStr(ex,s.w)} × ${fmt(s.r)}`:fmt(s.r)).join(', ');
  else out=main.map(s=>fmt(s.r)).join(' / ')+u;
  if(myo.length) out+=` + Myo ${myo.map(s=>fmt(s.r)).join('+')}`;
  const rr=rirRange(main); if(rr) out+=` · RIR ${rr}`;
  return out;
}

/* Wochenvolumen pro Muskelgruppe */
const VOL_TARGET={Brust:[10,20],Rücken:[10,20],Beine:[10,20],Schulter:[8,16],Bizeps:[6,14],Trizeps:[6,14],Waden:[6,12],Unterarme:[4,12],Core:[4,10]};
function planVolume(templates){
  const v={};
  for(const t of templates) for(const i of t.items){const ex=exById(i.ex); if(ex.unit==='note'||ex.unit==='interval') continue;
    const g=ex.group||'Sonstiges'; const n=ex.id==='myo_curl'?2:(+i.sets||0); v[g]=(v[g]||0)+n;}
  return v;
}
function doneVolume(weeks){
  const from=addDays(todayISO(),-7*weeks); const v={};
  for(const s of S.sessions) if(s.date>from) for(const e of s.entries){const ex=exById(e.ex); if(ex.unit==='note'||ex.unit==='interval') continue;
    const n=e.ex==='myo_curl'?Math.min(2,e.sets.length):workSets(e).length; const g=ex.group||'Sonstiges'; v[g]=(v[g]||0)+n/weeks;}
  return v;
}
function volStatus(g,n){const t=VOL_TARGET[g];if(!t)return 'ok';return n<t[0]?'low':n>t[1]?'high':'ok';}
function vVolume(templates,compareTemplates,showDone){
  const P=planVolume(templates), C=compareTemplates?planVolume(compareTemplates):null, D=showDone?doneVolume(4):null;

  const max=Math.max(22,...groups.map(g=>Math.max(P[g]||0,C?.[g]||0,D?.[g]||0)));

    h+=`<div class="vol-row"><div class="vol-name">${g}</div><div class="vol-track"><span class="vol-band" style="left:${X(t[0])};width:calc(${X(t[1])} - ${X(t[0])})"></span><span class="vol-bar ${st}" style="width:${X(n)}"></span>${C&&C[g]!==n?`<span class="vol-old" style="left:${X(C[g]||0)}" title="vorher ${fmt(C[g]||0)}"></span>`:''}${D?`<span class="vol-done" style="left:${X(D[g]||0)}" title="tatsächlich ${fmt(D[g]||0)}"></span>`:''}</div><div class="vol-n num">${fmt(n,0)}${C&&C[g]!==n?`<span class="muted small"> (${fmt(C[g]||0,0)})</span>`:''}</div></div>`;
  }
  h+='</div>';
  h+=`<div class="small muted">Arbeitssätze pro Woche je Hauptmuskel. Grauer Bereich = übliche Empfehlung.${C?' Strich = vorher.':''}${D?' Punkt = im Schnitt der letzten 4 Wochen wirklich gemacht.':''} Übungen zählen nur für ihre Hauptgruppe, Klimmzüge also nicht für Bizeps.</div>`;
  const low=groups.filter(g=>volStatus(g,P[g]||0)==='low'), high=groups.filter(g=>volStatus(g,P[g]||0)==='high');

  return h;

/* Deload-Erkennung */
function lastDeload(){
  let d=null;
  for(const s of S.sessions) if(s.deload||/deload/i.test(s.notes||'')) if(!d||s.date>d) d=s.date;
  for(const x of S.skips||[]) if(/deload/i.test(x.note||'')) if(!d||x.date>d) d=x.date;
  for(const b of S.breaks||[]) if(b.kind==='deload'||b.kind==='frei'&&daysBetween(b.from,b.to)>=4) if(b.to<=todayISO()&&(!d||b.to>d)) d=b.to;
  return d;
}
function deloadCheck(){
  const today=todayISO(); if(breakOn(today)) return null;
  if((S.breaks||[]).some(b=>b.from>today&&daysBetween(today,b.from)<=14)) return null;
  const ld=lastDeload(); const weeks=ld?Math.floor(daysBetween(ld,today)/7):null;
  const from=addDays(today,-28); let tot=0,fail=0;
  for(const s of S.sessions) if(s.date>=from) for(const e of s.entries) for(const x of e.sets) if(x.rir!=null&&x.t!=='myo'){tot++;if(x.rir<=0.5)fail++;}
  const share=tot?fail/tot:0; const stag=attention().filter(a=>a.chip==='stagniert').length;
  const reasons=[];
  if(weeks==null||weeks>=8) reasons.push(weeks==null?'Kein Deload in den Daten':`Letzter Deload vor ${weeks} Wochen`);
  if(share>=0.6&&tot>=20) reasons.push(`${Math.round(share*100)} % der Sätze der letzten 4 Wochen bei RIR 0–0,5`);
  if(stag>=3) reasons.push(`${stag} Übungen stagnieren`);
  const due=(weeks==null||weeks>=8)&&reasons.length>=2 || (weeks!=null&&weeks>=12);
  return due?{reasons,weeks,share}:null;
}
function nextMonday(){const t=todayISO();const wd=dDate(t).getDay();return addDays(t,wd===1?0:((8-wd)%7||7));}

/* Zeitbedarf & Kurzversion */
function estMin(item,sets){
  const ex=exById(item.ex); if(ex.unit==='interval') return protoMin(protoOf(item)); if(ex.unit==='note') return 10;
  const n=sets??item.sets??3; const work=ex.unit==='sec'?(item.repMax||30)/60:0.75; const rest=(S.settings.rest||120)/60;
  return n*(work+rest)+1;
}
function tplMinutes(t){return t.items.reduce((a,i)=>a+estMin(i),0);}
function canPair(a,b){
  const A=exById(a.ex),B=exById(b.ex);
  if(A.unit!=='reps'||B.unit!=='reps') return false;
  if((A.group||'')===(B.group||'')) return false;
  if(A.equip==='ez'&&B.equip==='ez') return false; // eine Stange
  if(A.equip==='db2'&&B.equip==='db2'&&S.equipment.dbCount<4) return false;
  return true;
}
function shortPlan(t,budget){
  let items=t.items.map((i,k)=>({...i,sets:Math.min(+i.sets||3,3),_k:k}));
  const rest=(S.settings.rest||120)/60;
  const pairs=[]; // Supersätze
  for(let k=0;k<items.length-1;k++){if(canPair(items[k],items[k+1])&&!items[k]._ss){items[k]._ss=items[k+1]._ss=String.fromCharCode(65+pairs.length);pairs.push([k,k+1]);k++;}}
  const total=()=>{let m=0;for(let k=0;k<items.length;k++){const i=items[k];const ex=exById(i.ex);
      if(i._ss&&items[k+1]&&items[k+1]._ss===i._ss){m+=Math.max(i.sets,items[k+1].sets)*(0.75*2+rest)+2;k++;} else m+=estMin(i,i.sets);}return m;};
  let guard=50;
  while(total()>budget&&guard--){
    const k=[...items.keys()].reverse().find(k=>items[k].sets>2&&exById(items[k].ex).unit!=='interval');
    if(k!=null){items[k].sets--;continue;}
    if(items.length<=1) break;
    const drop=items.pop(); if(drop._ss){const o=items.find(x=>x._ss===drop._ss);if(o)delete o._ss;}
  }
  return {items,minutes:Math.round(total()),dropped:t.items.length-items.length};
}

/* Rüstliste: welche Hantel wann wie beladen */
function plannedLoad(e){
  const ex=exById(e.ex); if(!EQUIP[ex.equip].weighted||ex.unit==='interval') return null;
  if(e.target?.targetW!=null) return e.target.targetW;
  const sg=suggest(e.ex,e.target); if(sg&&sg.target!=null) return sg.target;
  const L=lastEntry(e.ex); if(!L) return null; const ws=workSets(L.entry); return ws.length?Math.max(...ws.map(s=>s.w??0)):null;
}
function rigList(entries){
  const E=S.equipment; const inv={...E.plates}; const steps=[];
  const handles=Array.from({length:E.dbCount},(_,k)=>({id:k,w:null,pl:[]}));
  const label=k=>'Hantel '+(k+1);
  const ez={w:null,pl:[]};
  const needs=entries.map(e=>{const ex=exById(e.ex);const w=plannedLoad(e);return {e,ex,w,n:ex.equip==='db2'?2:ex.equip==='db1'?1:0};});
  const giveBack=o=>{for(const p of o.pl)inv[p]=(inv[p]||0)+2;o.pl=[];};
  const take=perSide=>{const r=plateSolve(perSide,inv,2);for(const p of r.used)inv[p]-=2;return r;};
  const usedLater=(h,idx)=>needs.some((y,k)=>k>idx&&y.n&&y.w===h.w);
  const nextUse=(w,idx)=>{const j=needs.findIndex((y,k)=>k>idx&&y.n&&y.w===w);return j<0?1e9:j;};
  const sideStr=r=>(r.used.length?r.used.map(p=>fmt(p,2)).join('+'):'ohne Scheiben');
  // lädt mit Restbestand; reicht es nicht, werden nicht mehr gebrauchte Hanteln abgebaut
  const loadWith=(perSide,idx,keep,lines)=>{
    let r=take(perSide);
    if(r.rest>0.001){for(const p of r.used)inv[p]+=2;
      const idle=handles.filter(h=>h.w!=null&&!keep.includes(h)).sort((a,b)=>nextUse(b.w,idx)-nextUse(a.w,idx));
      for(const h of idle){lines.push(`${label(h.id)} abbauen (${fmt(h.w,2)} kg${usedLater(h,idx)?', später neu beladen':', wird nicht mehr gebraucht'})`);giveBack(h);h.w=null;r=take(perSide);if(r.rest<=0.001)break;for(const p of r.used)inv[p]+=2;}
      if(r.rest>0.001) r=take(perSide);
    }
    if(r.rest<=0.001&&r.used.length>4){ // viele kleine Scheiben: lieber nicht mehr gebrauchte Hanteln abbauen
      const idle=handles.filter(h=>h.w!=null&&!keep.includes(h)&&!usedLater(h,idx));
      if(idle.length){for(const p of r.used)inv[p]+=2;const back=idle.map(h=>({h,w:h.w,pl:h.pl}));for(const h of idle){giveBack(h);}
        const r2=take(perSide);
        if(r2.rest<=0.001&&r2.used.length<r.used.length){for(const b of back){lines.push(`${label(b.h.id)} abbauen (${fmt(b.w,2)} kg, wird nicht mehr gebraucht)`);b.h.w=null;}r=r2;}
        else{for(const p of r2.used)inv[p]+=2;for(const b of back){for(const p of b.pl)inv[p]-=2;b.h.pl=b.pl;}r=take(perSide);}}
    }
    return r;
  };
  needs.forEach((x,idx)=>{
    if(x.w==null) return; const lines=[];
    if(x.n){
      let use=handles.filter(h=>h.w===x.w).slice(0,x.n);
      if(use.length<x.n){
        const cand=handles.filter(h=>!use.includes(h)).sort((a,b)=>a.w==null&&b.w==null?a.id-b.id:a.w==null?-1:b.w==null?1:nextUse(b.w,idx)-nextUse(a.w,idx));
        for(const h of cand){if(use.length>=x.n)break;
          const from=h.w; giveBack(h); h.w=null;
          const r=loadWith(x.w/2,idx,[...use,h],lines); h.pl=r.used; h.w=x.w; use.push(h);
          lines.push(`${label(h.id)}: ${from==null?'beladen':'umbauen von '+fmt(from,2)+' kg'} auf ${fmt(x.w,2)} kg (je Seite ${sideStr(r)})${r.rest>0.001?` – es fehlen ${fmt(r.rest*2,2)} kg Scheiben`:''}`);}
      }
      steps.push({idx,ex:x.ex,w:x.w,lines,keep:lines.length?'':`${use.map(h=>label(h.id)).join(' + ')} liegen bereit`});
    } else if(x.ex.equip==='ez'){
      if(ez.w!==x.w){giveBack(ez);const r=loadWith((x.w-E.ezBar)/2,idx,[],lines);ez.pl=r.used;ez.w=x.w;
        lines.push(`EZ-Stange: ${fmt(x.w,2)} kg (je Seite ${sideStr(r)})${r.rest>0.001?` – es fehlen ${fmt(r.rest*2,2)} kg Scheiben`:''}`);}
      steps.push({idx,ex:x.ex,w:x.w,lines,keep:'EZ-Stange bleibt'});
    } else if(x.ex.equip==='belt') steps.push({idx,ex:x.ex,w:x.w,lines:[`Gürtel: ${fmt(x.w,2)} kg an die Kette, danach wieder abnehmen`]});
    else if(x.ex.equip==='grip') steps.push({idx,ex:x.ex,w:x.w,lines:[`Gummigriff-Hantel: ${fmt(x.w,2)} kg`]});
    else if(x.ex.equip==='roller') steps.push({idx,ex:x.ex,w:x.w,lines:[`Wrist Roller: ${fmt(x.w,2)} kg ans Band`]});
  });
  return steps;
}
function vRig(entries){
  const steps=rigList(entries); if(!steps.length) return '<div class="small muted">Für diese Einheit gibt es keine Gewichte vorzubereiten.</div>';
  let h='<ol class="rig">';

/* Aufwärmsätze */
function warmups(ex,w){
  if(!w||ex.unit!=='reps') return [];
  const base=ex.equip==='ez'?S.equipment.ezBar:0; const step=ex.equip==='ez'?1:1;
  if((ex.equip==='ez'&&w<35)||((ex.equip==='db2'||ex.equip==='db1')&&w<20)||!['ez','db2','db1'].includes(ex.equip)) return [];
  const pct=w>=60?[[0.5,8],[0.7,4],[0.85,2]]:[[0.5,8],[0.75,4]];
  return pct.map(([p,r])=>({w:Math.max(base,Math.round(w*p/step)*step),r}));
}

/* Variantenleiter & Hülle um die Empfehlung */
function suggest(exId,item){
  const ex=exById(exId); const r=suggestBase(exId,item); if(!r) return r;
  const today=todayISO(); const br=breakOn(S.active?.date||today);
  if(br&&br.kind==='deload'&&ex.unit!=='interval'){
    const H=historyFor(exId).filter(h=>!h.session.deload); const ws=H.length?workSets(H[H.length-1].entry):[];
    const w=ws.length?Math.max(...ws.map(s=>s.w??0)):null; const inc=increment(ex);
    const dw=w&&EQUIP[ex.equip].weighted?Math.round(w*0.9/inc)*inc:null;
    return {kind:'hold',short:dw!=null?`Deload ${fmt(dw,2)} kg`:'Deload',text:`Deload-Woche: 2 Sätze, ${dw!=null?fmt(dw,2)+' kg, ':''}2–3 Wiederholungen vor dem Versagen aufhören (RIR 3).`,target:dw,deload:true};
  }
  if(r.kind==='up'&&!EQUIP[ex.equip].weighted&&ex.next){const n=exById(ex.next);r.text=`Obere Grenze erreicht. Nächste Stufe: ${n.name}. Tausch die Übung über „Plan ändern“ oder probier sie heute als Zusatzsatz.`;r.short=`→ ${n.name}`;}
  if(S.active&&checkBad(S.active.check)&&r.kind==='up'){return {kind:'hold',short:'Halten (Check-in)',text:'Laut Check-in kein guter Tag. Gewicht und Wiederholungen vom letzten Mal halten, Steigerung beim nächsten Mal.',target:null};}
  return r;
}

function prDateSet(){const m={};for(const p of recentPRs(100000))m[p.date]=(m[p.date]||0)+1;return m;}

function finishSession(){
  const A=S.active; const prs=[];
  const entries=[];
  for(const e of A.entries){
    const ex=exById(e.ex);
    const sets=e.sets.filter(s=>s.r!=null||(s.done&&s.w!=null)).map(s=>{const o={};if(s.w!=null)o.w=s.w;if(s.r!=null)o.r=s.r;if(s.rir!=null)o.rir=s.rir;if(s.t)o.t=s.t;if(s.n)o.n=s.n;return o;}).filter(s=>s.r!=null);
    if(ex.unit==='interval'&&e.iv){const iv={...e.iv};if(iv.done==null)iv.done=iv.rounds;const ent={ex:e.ex,sets:[],iv};if(e.note)ent.note=e.note;entries.push(ent);continue;}
    if(!sets.length&&!e.note) continue;
    const ent={ex:e.ex,sets};if(e.variant)ent.variant=e.variant;if(e.note)ent.note=e.note;
    if(sets.length&&ex.unit!=='note'){
      const prev=historyFor(e.ex).filter(h=>h.session.id!==A.id).map(h=>bestOf(ex,h.entry)?.metric||0);
      const b=bestOf(ex,ent); if(b&&prev.length&&b.metric>Math.max(...prev)) prs.push({ex:ex.name,val:b.metric,label:metricLabel(ex)});
    }
    entries.push(ent);
  }
  if(!entries.length){toast('Keine Sätze eingetragen.');return;}
  const P=S.plans.find(p=>p.id===A.plan)||activePlan();
  const sess={id:A.id,date:A.date,template:A.template,plan:P.id,planRev:A.planRev??P.rev,notes:A.notes,entries,duration:Math.round((Date.now()-A.startedAt)/60000)};
  if(A.deload||breakOn(A.date)?.kind==='deload') sess.deload=true;
  if(A.check&&Object.keys(A.check).length) sess.check=A.check;
  if(A.short) sess.short=A.short;
  if(!entries.length) return;
  if(A.check?.bw){S.bodyweights=(S.bodyweights||[]).filter(x=>x.date!==A.date);S.bodyweights.push({date:A.date,kg:A.check.bw});S.bodyweights.sort((a,b)=>a.date<b.date?-1:1);S.settings.bodyweight=S.bodyweights[S.bodyweights.length-1].kg;}
  const old=S.sessions.find(s=>s.id===A.id); if(old&&old.imported) sess.imported=true;
  const k=S.sessions.findIndex(s=>s.id===A.id); if(k>=0) S.sessions[k]=sess; else S.sessions.push(sess);
  S.active=null; stopRest(); clearInterval(ivIv); ivIv=null; ui.summary={id:sess.id,prs}; saveNow(); render(); window.scrollTo(0,0);
}

/* ---------- Verlauf ---------- */
function vVerlauf(){
  if(ui.exDetail) return vExDetail();
  let h=`<div class="stack-lg"><div class="seg" role="group" aria-label="Ansicht"><button aria-pressed="${ui.histMode!=='ex'}" data-act="hist" data-m="cal">Kalender</button><button aria-pressed="${ui.histMode==='ex'}" data-act="hist" data-m="ex">Übungen</button></div>`;
  if(!S.sessions.length&&ui.histMode==='ex') return h+'<div class="empty">Noch keine Einheiten. Importiere deine Daten unter Mehr oder starte ein Training.</div></div>';
  if(ui.histMode==='ex'){
    for(const g of GROUPS){
      const xs=S.exercises.filter(e=>(e.group||'Sonstiges')===g&&e.unit!=='note').map(ex=>({ex,H:historyFor(ex.id)})).filter(o=>o.H.length);
      if(!xs.length) continue;
      xs.sort((a,b)=>a.H[a.H.length-1].date<b.H[b.H.length-1].date?1:-1);
      h+=`<section class="stack"><h2>${g}</h2><div class="list">`;
      for(const {ex,H} of xs){
        const vals=H.map(x=>bestOf(ex,x.entry)?.metric).filter(v=>v!=null);

function vExDetail(){

}
function chartSeries(ex){
  const H=historyFor(ex.id); const pts=[];
  for(const x of H){if(x.entry.iv){const iv=x.entry.iv;const v=ui.chartMetric==='vol'?(iv.warm||0)+(iv.cool||0)+(iv.done??iv.rounds)*(iv.work+iv.rest)/60:ivSprintSec(iv);pts.push({d:x.date,v,e:x.entry});continue;}
    const ws=workSets(x.entry);if(!ws.length)continue;let v;
    if(ui.chartMetric==='best') v=bestOf(ex,x.entry)?.metric;
    else if(ui.chartMetric==='top') v=Math.max(...ws.map(s=>s.w??0));
    else v=EQUIP[ex.equip].weighted&&ex.unit==='reps'?ws.reduce((a,s)=>a+effLoad(ex,s.w)*s.r,0):ws.reduce((a,s)=>a+s.r,0);
    if(v!=null&&isFinite(v)) pts.push({d:x.date,v,e:x.entry});}
  return pts;
}
function niceTicks(min,max,n){const span=max-min||1;const step0=span/n;const mag=10**Math.floor(Math.log10(step0));const step=[1,2,2.5,5,10].map(m=>m*mag).find(s=>s>=step0);const lo=Math.floor(min/step)*step,hi=Math.ceil(max/step)*step;const t=[];for(let v=lo;v<=hi+1e-9;v+=step)t.push(Math.round(v*100)/100);return t;}
function drawChart(){
  const ex=exById(ui.exDetail); const svg=$('#chartsvg'); if(!svg) return;
  const P=chartSeries(ex); const W=340,Hh=180,l=40,r=14,t=14,b=26;
  if(P.length<2){svg.innerHTML=`<text x="${W/2}" y="${Hh/2}" text-anchor="middle" fill="var(--muted)" font-size="13">Zu wenige Daten für ein Diagramm</text>`;return;}
  const x0=dDate(P[0].d).getTime(),x1=dDate(P[P.length-1].d).getTime();
  const vs=P.map(p=>p.v); const ticks=niceTicks(Math.min(...vs),Math.max(...vs),4);
  const y0=ticks[0],y1=ticks[ticks.length-1];
  const X=d=>l+(x1===x0?0.5:(dDate(d).getTime()-x0)/(x1-x0))*(W-l-r);
  const Y=v=>t+(1-(v-y0)/((y1-y0)||1))*(Hh-t-b);
  let s='';
  for(const tv of ticks){s+=`<line x1="${l}" x2="${W-r}" y1="${Y(tv)}" y2="${Y(tv)}" stroke="var(--line)" stroke-width="1"/><text x="${l-6}" y="${Y(tv)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${fmt(tv)}</text>`;}
  const months=[];let m=new Date(dDate(P[0].d).getFullYear(),dDate(P[0].d).getMonth()+1,1);
  while(m.getTime()<=x1){months.push(new Date(m));m=new Date(m.getFullYear(),m.getMonth()+1,1);}
  const step=Math.ceil(months.length/5)||1;
  months.forEach((mm,i)=>{if(i%step)return;const iso=mm.getFullYear()+'-'+String(mm.getMonth()+1).padStart(2,'0')+'-01';const xx=X(iso);s+=`<line x1="${xx}" x2="${xx}" y1="${Hh-b}" y2="${Hh-b+4}" stroke="var(--muted)"/><text x="${xx}" y="${Hh-6}" text-anchor="middle" font-size="11" fill="var(--muted)">${mm.toLocaleDateString('de-DE',{month:'short'})}</text>`;});
  const line=P.map((p,i)=>(i?'L':'M')+X(p.d).toFixed(1)+' '+Y(p.v).toFixed(1)).join(' ');
  s+=`<path d="${line} L${X(P[P.length-1].d).toFixed(1)} ${Hh-b} L${X(P[0].d).toFixed(1)} ${Hh-b} Z" fill="var(--accent)" fill-opacity=".12"/>`;
  s+=`<path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  P.forEach((p,i)=>{const last=i===P.length-1;s+=`<circle cx="${X(p.d)}" cy="${Y(p.v)}" r="${last?5:3}" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>`;});
  const lp=P[P.length-1]; s+=`<text x="${Math.min(X(lp.d),W-r)}" y="${Math.max(Y(lp.v)-10,11)}" text-anchor="end" font-size="12" font-weight="600" fill="var(--fg)">${fmt(lp.v)}</text>`;
  for(const pl of S.plans) for(const pr of pl.periods){const tt=dDate(pr.from).getTime();if(tt>x0&&tt<=x1){const xx=X(pr.from);s+=`<line x1="${xx}" x2="${xx}" y1="${t}" y2="${Hh-b}" stroke="var(--warn)" stroke-width="1.5" stroke-dasharray="4 3"/><text x="${xx+3}" y="${t+9}" font-size="10" fill="var(--warn)">${esc(pl.name)}</text>`;}}
  s+=`<line id="cross" x1="0" x2="0" y1="${t}" y2="${Hh-b}" stroke="var(--muted)" stroke-dasharray="3 3" visibility="hidden"/>`;
  P.forEach((p,i)=>{const xa=i?(X(P[i-1].d)+X(p.d))/2:l, xb=i<P.length-1?(X(p.d)+X(P[i+1].d))/2:W-r;s+=`<rect x="${xa}" y="${t}" width="${Math.max(1,xb-xa)}" height="${Hh-t-b}" fill="transparent" data-pi="${i}"/>`;});
  svg.innerHTML=s;
  const show=i=>{const p=P[i];const c=svg.querySelector('#cross');c.setAttribute('x1',X(p.d));c.setAttribute('x2',X(p.d));c.setAttribute('visibility','visible');$('#charttip').textContent=`${fmtDate(p.d,true)}: ${fmt(p.v)} · ${entryStr(ex,p.e)}`;};
  svg.querySelectorAll('rect[data-pi]').forEach(rc=>{rc.addEventListener('pointerenter',()=>show(+rc.dataset.pi));rc.addEventListener('click',()=>show(+rc.dataset.pi));});
}

function calcOut(target){
  if(target==null) return '<div class="small muted">Gewicht eingeben, dann zeige ich dir die Scheiben pro Seite.</div>';
  const E=S.equipment; const ez=ui.calc.mode==='ez';
  if(ez&&target>E.ezMax) return `<div class="warn-box">Mehr als ${fmt(E.ezMax)} kg passt nicht auf die EZ-Stange.</div>`;
  const perSide=ez?(target-E.ezBar)/2:target/2;
  if(perSide<0) return `<div class="warn-box">Unter dem Stangengewicht (${fmt(E.ezBar)} kg).</div>`;
  const inv={...E.plates}; if(!ez){for(const k in inv) inv[k]=Math.floor(inv[k]/2)*2;}
  const {used,rest}=plateSolve(perSide,inv,2);
  const col={'10':'var(--plate-10)','5':'var(--plate-5)','2.5':'var(--plate-2)','1.25':'var(--plate-1)','0.5':'var(--plate-05)'};
  const hgt={'10':74,'5':60,'2.5':48,'1.25':38,'0.5':30};
  let v='<div class="bar-vis" aria-hidden="true"><div class="shaft"></div><div class="sleeve"></div>'+used.map(p=>`<div class="plate" style="background:${col[String(p)]||'var(--muted)'};height:${hgt[String(p)]||30}px;width:${p>=5?16:12}px">${String(p).replace('.',',')}</div>`).join('')+'</div>';
  v+=`<div class="num"><b>Pro Seite:</b> ${used.length?used.map(p=>fmt(p,2)).join(' + '):'keine Scheiben'} = ${fmt(perSide-rest,2)} kg</div>`;
  if(rest>0.001) v+=`<div class="warn-box">Nicht exakt machbar, es fehlen ${fmt(rest*2,2)} kg. Nächstes mögliches Gewicht: ${fmt(ez?E.ezBar+(perSide-rest)*2:(perSide-rest)*2,2)} kg.</div>`;
  if(!ez) v+=`<div class="small muted">Inkl. Stange: ${fmt(target+E.dbHandle,2)} kg pro Hantel. Für zwei Hanteln brauchst du die doppelte Menge.</div>`;
  return v;
}

/* ---------- Startseite „Heute“ ---------- */
const normVar = v => String(v||'').trim().toLowerCase();
function median(a){const s=[...a].sort((x,y)=>x-y);const m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2;}
function sparkline(vals){
  if(vals.length<2) return '';
  const W=72,H=22,mn=Math.min(...vals),mx=Math.max(...vals),r=mx-mn||1;
  const pts=vals.map((v,i)=>[(i/(vals.length-1))*(W-4)+2,H-2-((v-mn)/r)*(H-4)]);
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true"><polyline points="${pts.map(p=>p.map(n=>n.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${pts[pts.length-1][0]}" cy="${pts[pts.length-1][1]}" r="3" fill="var(--accent)"/></svg>`;
}
function recentPRs(days){
  const from=addDays(todayISO(),-days); const all=sessionsSorted(); const best={}; const out=[];
  for(const s of all){
    for(const e of s.entries){
      const ex=exById(e.ex); if(ex.unit==='note'||ex.unit==='interval') continue;
      const b=bestOf(ex,e); if(!b) continue;
      const k=e.ex+'|'+normVar(e.variant);
      if(s.date>=from && best[k]!=null && b.metric>best[k]+1e-9 && b.metric<best[k]*1.5) out.push({ex,date:s.date,val:b.metric,set:b.set,prev:best[k]});
      best[k]=Math.max(best[k]??-Infinity,b.metric);
    }
  }
  return out.sort((a,b)=>a.date<b.date?1:-1);
}
function progressSince(from){
  const ids=[...new Set(tpls().flatMap(t=>t.items.map(i=>i.ex)))]; const out=[];
  for(const id of ids){
    const ex=exById(id); if(ex.unit==='note'||ex.unit==='interval') continue;
    const H0=historyFor(id).filter(h=>h.date>=from); if(!H0.length) continue;
    const v=normVar(H0[H0.length-1].entry.variant);
    const vals=H0.filter(h=>normVar(h.entry.variant)===v).map(h=>bestOf(ex,h.entry)?.metric).filter(x=>x!=null&&x>0);
    if(vals.length<6) continue;
    let jumpy=false; for(let i=1;i<vals.length;i++){const q=vals[i]/vals[i-1];if(q>1.5||q<0.6){jumpy=true;break;}}
    if(jumpy) continue;
    const a=median(vals.slice(0,3)),b=median(vals.slice(-3)); const pct=(b/a-1)*100;
    out.push({ex,pct,vals,a,b});
  }
  return out.sort((x,y)=>y.pct-x.pct);
}
function attention(){
  const out=[]; const seen=new Set();
  for(const t of tpls()) for(const i of t.items){
    if(seen.has(i.ex)) continue; seen.add(i.ex);
    const ex=exById(i.ex); const sg=suggest(i.ex,i); if(!sg) continue;
    if(sg.kind==='warn') out.push({ex,cls:'warn',chip:sg.chip||'Limit',text:sg.text});
    else if(sg.kind==='down') out.push({ex,cls:'down',chip:'Zurück',text:sg.text});
    else if(sg.stagnant){const L=lastEntry(i.ex);out.push({ex,cls:'warn',chip:'stagniert',text:`Seit 4 Einheiten kein neuer Bestwert. Zuletzt ${L?entryStr(ex,L.entry):''}.`});}
  }
  return out;
}
const SKIP_REASONS=['Krank','Keine Zeit','Urlaub','Schmerzen','Sonstiges'];
function skipOn(d){return (S.skips||[]).find(x=>x.date===d);}
/* Status eines geplanten Tages in der laufenden Woche */
function weekInfo(ref){
  const t=todayISO(); const base=ref||t; const wd=dDate(base).getDay()||7; const mon=addDays(base,1-wd); const sun=addDays(mon,6);
  const days=[]; const weekSessions=S.sessions.filter(s=>s.date>=mon&&s.date<=sun); const used=new Set();
  for(let i=0;i<7;i++){
    const d=addDays(mon,i); const dow=dDate(d).getDay(); const dp=dayPlan(d);
    const own=weekSessions.filter(s=>s.date===d);
    let st='free', info='';
    if(dp.brk&&dp.brk.kind==='frei'){st=own.length?'extra':'pause';info=dp.brk.reason;}
    else if(dp.tpls.length){
      let allDone=true,anyMoved=false;
      for(const tp of dp.tpls){const ex=own.find(s=>s.template===tp.id&&!used.has(s.id))||weekSessions.find(s=>s.template===tp.id&&!used.has(s.id));
        if(ex){used.add(ex.id);if(ex.date!==d){anyMoved=true;info='nachgeholt am '+fmtDate(ex.date);}} else allDone=false;}
      if(allDone) st=anyMoved?'moved':'done';
      else if(skipOn(d)){st='skip';info=skipOn(d).reason;}
      else if(d<t) st='missed'; else if(d===t) st='today'; else st='planned';
      if(!info&&dp.tpls.some(x=>x._move)) info='verschoben';
    } else if(dp.movedOut){st=own.length?'extra':'shift';info='→ '+DAYNAMES[dDate(dp.movedOut.to).getDay()].slice(0,2);}
    else if(own.length) st='extra';
    days.push({d,dow,plan:dp.tpls[0]||null,tpls:dp.tpls,brk:dp.brk,st,info});
  }
  return {days,mon,sun};
}
function weekStrip(){
  const W=weekInfo(); let done=0,planned=0;
  const look={pause:['–','var(--muted)','Pause'],shift:['→','var(--muted)','verschoben'],done:['●','var(--good)','erledigt'],moved:['●','var(--good)','nachgeholt'],extra:['●','var(--accent)','Zusatztraining'],skip:['–','var(--muted)','ausgefallen'],missed:['○','var(--bad)','verpasst'],today:['○','var(--accent)','heute'],planned:['○','var(--muted)','geplant'],free:['·','var(--line)','frei']};
  let h='<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center">';
  for(const x of W.days){
    if(x.plan){planned++; if(x.st==='done'||x.st==='moved') done++;}
    const [m,c,l]=look[x.st]; const isT=x.d===todayISO();
    h+=`<div title="${l}${x.info?': '+esc(x.info):''}"><div class="small ${isT?'':'muted'}" style="font-weight:${isT?700:500}">${DAYNAMES[x.dow].slice(0,2)}</div><div style="font-size:20px;line-height:1.2;color:${c}" aria-label="${l}">${m}</div>${x.st==='moved'?'<div class="small muted" style="font-size:10px">nach­geholt</div>':['skip','pause','shift'].includes(x.st)||x.info==='verschoben'?`<div class="small muted" style="font-size:10px">${esc(x.info)}</div>`:''}</div>`;
  }
  const skipped=W.days.filter(x=>x.st==='skip').length;
  planned=W.days.filter(x=>x.tpls.length).length;
  return {html:h+'</div>',done,planned,skipped,days:W.days};
}
