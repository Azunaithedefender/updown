    case 'startshort': startShort(el.dataset.id,+el.dataset.m); break;
    case 'chk':{A.check=A.check||{};const k=el.dataset.k,v=+el.dataset.v;A.check[k]=A.check[k]===v?null:v;save();render();break;}
    case 'deloadplan':{const from=nextMonday(),to=addDays(from,6);ui.brk={from,to,kind:'deload',reason:'Deload',altPlan:'',note:''};const err=saveBreak();if(err){toast(err);return;}save();render();toast(`Deload-Woche ${fmtRange(from,to)} eingetragen.`);break;}
    case 'bwadd':{const v=parseNum($('#bwin').value);if(v==null||v<30||v>250){toast('Bitte ein Gewicht in kg eingeben.');return;}const d=todayISO();S.bodyweights=(S.bodyweights||[]).filter(x=>x.date!==d);S.bodyweights.push({date:d,kg:v});S.bodyweights.sort((a,b)=>a.date<b.date?-1:1);S.settings.bodyweight=S.bodyweights[S.bodyweights.length-1].kg;save();render();toast('Körpergewicht gespeichert.');break;}
    case 'quickdone':{const d=el.dataset.d;const f=findTpl(el.dataset.id);const P=f?.plan||activePlan();
      S.sessions.push({id:uid(),date:d,template:el.dataset.id||null,plan:P.id,planRev:P.rev,notes:'',entries:[],quick:true,deload:breakOn(d)?.kind==='deload'||undefined});
      ui.skipOpen=null;save();render();toast(`${fmtDate(d,true)} abgehakt. Details kannst du später im Verlauf nachtragen.`);break;}
    case 'calprev': ui.calMonth=shiftMonth(ui.calMonth,-1); ui.calDay=null; ui.calBrk=null; render(); break;
    case 'calnext': ui.calMonth=shiftMonth(ui.calMonth,1); ui.calDay=null; ui.calBrk=null; render(); break;
    case 'caltoday': ui.calMonth=todayISO().slice(0,7); ui.calDay=todayISO(); ui.calBrk=null; render(); break;
    case 'calrange': ui.calRange={step:1}; ui.calDay=null; ui.calBrk=null; render(); break;
    case 'calrangeno': ui.calRange=null; render(); break;
    case 'calday':{const d=el.dataset.d,R=ui.calRange;
      if(R){ if(R.step===1){R.from=d;R.step=2;} else if(R.step===2){let a=R.from,b=d;if(b<a)[a,b]=[b,a];R.from=a;R.to=b;R.step=3;ui.brk={from:a,to:b,kind:'frei',reason:'Urlaub',altPlan:'',note:''};} else {R.from=d;R.to=null;R.step=2;} render(); }
      else { ui.calDay=ui.calDay===d?null:d; ui.calBrk=null; ui.skipOpen=null; ui.confirm=null; if(d.slice(0,7)!==ui.calMonth) ui.calMonth=d.slice(0,7); render(); }
      setTimeout(()=>{const x=$('#calsheet');if(x)x.scrollIntoView({behavior:'smooth',block:'nearest'});},30); break;}
    case 'calrangesave':{const err=saveBreak();if(err){toast(err);return;}ui.calRange=null;save();render();toast('Zeitraum gespeichert.');break;}
    case 'calbrk': ui.calBrk=el.dataset.id; ui.calDay=null; ui.confirm=null; render(); setTimeout(()=>{const x=$('#calsheet');if(x)x.scrollIntoView({behavior:'smooth',block:'nearest'});},30); break;
    case 'calclose': ui.calDay=null; ui.calBrk=null; render(); break;
    case 'calfree': startSession(''); S.active.date=el.dataset.d; save(); render(); break;
    case 'hist': ui.histMode=el.dataset.m; render(); break;
    case 'exd': ui.exDetail=el.dataset.id; ui.chartMetric='best'; render(); window.scrollTo(0,0); break;
    case 'back': ui.exDetail=null; render(); break;
    case 'metric': ui.chartMetric=el.dataset.m; render(); break;
    case 'opens': ui.openSession=ui.openSession===el.dataset.id?null:el.dataset.id; ui.confirm=null; render(); break;
    case 'askdel': ui.confirm='del:'+el.dataset.id; render(); break;
    case 'dels': S.sessions=S.sessions.filter(s=>s.id!==el.dataset.id); ui.confirm=null; save(); render(); toast('Einheit gelöscht'); break;
    case 'edits':{ if(S.active){toast('Erst das laufende Training beenden.');return;}
      const s=S.sessions.find(x=>x.id===el.dataset.id);
      S.active={id:s.id,date:s.date,template:s.template,plan:s.plan,planRev:s.planRev,startedAt:Date.now()-(s.duration||0)*60000,notes:s.notes||'',entries:s.quick&&!s.entries.length?(findTpl(s.template)?.t.items||[]).map(i=>newEntry(i.ex,i)):s.entries.map(e=>({ex:e.ex,variant:e.variant||'',note:e.note||'',target:null,sets:e.sets.map(x=>({...x,done:true})),...(e.iv?{iv:{...e.iv},ivDone:true}:{})}))};
      save(); go('training'); location.hash='training'; break;}
    case 'pm': ui.planMode=el.dataset.m; ui.editTpl=null; ui.planView=null; render(); break;
    case 'pview': ui.planView=el.dataset.id; ui.editTpl=null; ui.confirm=null; ui.showRev=null; render(); window.scrollTo(0,0); break;
    case 'pback': ui.planView=null; ui.editTpl=null; ui.confirm=null; render(); window.scrollTo(0,0); break;
    case 'pchange':{const P=S.plans.find(p=>p.id===el.dataset.id);const d=draftFor(P.id)||makeDraft('revise',P);ui.planView=d.id;save();render();window.scrollTo(0,0);break;}
    case 'pnew':{const d=el.dataset.m==='copy'?makeDraft('new',activePlan()):makeDraft('new',null,[],{name:'Neuer Plan'});ui.planView=d.id;save();render();window.scrollTo(0,0);break;}
    case 'pcopy':{const P=S.plans.find(p=>p.id===el.dataset.id);const d=makeDraft('new',P,null,{name:P.name+' (Kopie)'});ui.planView=d.id;save();render();window.scrollTo(0,0);break;}
    case 'revcopy':{const P=S.plans.find(p=>p.id===el.dataset.id);const r=P.revisions.find(x=>x.rev===+el.dataset.k);const d=makeDraft('new',P,r.templates,{name:P.name+' V'+r.rev+' (Kopie)'});ui.planView=d.id;save();render();window.scrollTo(0,0);break;}
    case 'showrev': ui.showRev=ui.showRev===el.dataset.k?null:el.dataset.k; render(); break;
    case 'askpdel': ui.confirm='pdel:'+el.dataset.id; render(); break;
    case 'pdel':{const P=S.plans.find(p=>p.id===el.dataset.id);const nm=P?.name;if(P&&deletePlan(P)){ui.confirm=null;ui.planView=null;await saveNow();render();toast(`„${nm}“ gelöscht. Einheiten bleiben erhalten.`);}break;}
    case 'askreact': ui.confirm='react:'+el.dataset.id; render(); break;
    case 'preact':{const P=S.plans.find(p=>p.id===el.dataset.id);activatePlan(P);ui.confirm=null;ui.planView=null;await saveNow();render();toast(`„${P.name}“ ist wieder aktiv.`);break;}
    case 'dcommit':{const D=editDraft();const P=commitRevision(D);ui.planView=null;await saveNow();render();toast(P?`Gespeichert als Version ${P.rev}.`:'Ausgangsplan nicht gefunden.');break;}
    case 'dactivate':{const D=editDraft();if(!D.templates.length){toast('Der Plan hat noch keine Trainingstage.');return;}activatePlan(D);ui.planView=null;await saveNow();render();toast(`„${D.name}“ ist jetzt aktiv.`);break;}
    case 'askddel': ui.confirm='ddel'; render(); break;
    case 'ddel':{const D=editDraft();S.plans=S.plans.filter(p=>p!==D);ui.planView=null;ui.confirm=null;save();render();toast('Entwurf verworfen.');break;}
    case 'applyplan':{const d=draftFromCoachPlan(ui.parsed);if(!d){toast('Plan enthält keine gültigen Tage.');return;}S.coachLog.push({date:todayISO(),summary:ui.parsed.summary||'',changes:['Neuer Plan als Entwurf: '+d.name]});ui.parsed=null;ui.reply='';ui.planMode='week';ui.planView=d.id;save();location.hash='plan';render();break;}
    case 'edtpl': ui.editTpl=el.dataset.id; render(); window.scrollTo(0,0); break;
    case 'tplback': ui.editTpl=null; ui.confirm=null; render(); break;
    case 'newtpl':{const used=new Set(edT().map(t=>t.weekday));const wd=[1,2,3,4,5,6,0].find(d=>!used.has(d))??1;const t={id:'t_'+uid(),name:'Neuer Tag',weekday:wd,items:[]};edT().push(t);ui.editTpl=t.id;save();render();break;}
    case 'timv':{const t=edT().find(x=>x.id===ui.editTpl);const k=+el.dataset.k,d=+el.dataset.d;if(k+d<0||k+d>=t.items.length)return;const [x]=t.items.splice(k,1);t.items.splice(k+d,0,x);save();render();break;}
    case 'tirm':{const t=edT().find(x=>x.id===ui.editTpl);t.items.splice(+el.dataset.k,1);save();render();break;}
    case 'tiadd':{const t=edT().find(x=>x.id===ui.editTpl);t.items.push({ex:$('#tiadd').value,sets:3,repMin:8,repMax:12,note:''});save();render();break;}
    case 'askdeltpl': ui.confirm='deltpl'; render(); break;
    case 'deltpl': {const d=editDraft();d.templates=d.templates.filter(t=>t.id!==ui.editTpl);} ui.editTpl=null; ui.confirm=null; save(); render(); break;
    case 'newex':{const n=$('#newex').value.trim();if(!n)return;if(exByName(n)){toast('Gibt es schon.');return;}S.exercises.push({id:'x_'+uid(),name:n,equip:'db2',unit:'reps',group:'Sonstiges'});save();render();toast('Übung angelegt – Gerät und Gruppe unter „Sonstiges“ anpassen.');break;}
    case 'calcm': ui.calc.mode=el.dataset.m; render(); break;
    case 'conadd': S.constraints.push({id:uid(),text:'',active:true,health:true}); save(); render(); break;
    case 'conrm': S.constraints.splice(+el.dataset.k,1); save(); render(); break;
    case 'crange': ui.coachRange=el.dataset.m; if(ui.pkg) ui.pkg=coachPackage(ui.coachRange); render(); break;
    case 'mkpkg': ui.pkg=coachPackage(ui.coachRange); render(); setTimeout(()=>$('#pkg')?.scrollIntoView({block:'center'}),0); break;
    case 'dlpkg': await deliverFile(`hoch-runter-coach-${todayISO()}.txt`,ui.pkg,'text/plain'); break;
    case 'cppkg':{const ok=await copyText(ui.pkg,$('#pkg'));toast(ok?'Kopiert. Jetzt in der KI einfügen.':'Text markiert – bitte selbst kopieren.');break;}
    case 'shpkg': try{await navigator.share({text:ui.pkg,title:'Hoch-Runter Coach-Paket'});}catch(e){} break;
    case 'parse':{ui.reply=$('#reply').value;const p=parseCoachReply(ui.reply);ui.parsed=p||false;render();break;}
    case 'apply':{const P=ui.parsed;const done=[];let fail=0;const A=activePlan();
      const d=draftFor(A.id)||makeDraft('revise',A,null,{source:'coach'});d.source='coach';if(P.summary)d.reason=P.summary;
      P.changes.forEach((c,k)=>{if(c._off)return;const ds=describeChange(c,d.templates);if(ds.problem)return;if(applyChange(c,d.templates))done.push(ds.txt);else fail++;});
      if(done.length) S.coachLog.push({date:todayISO(),summary:P.summary||'',changes:done});
      ui.parsed=null;ui.reply='';ui.planMode='week';ui.planView=d.id;save();location.hash='plan';render();toast(`${done.length} Änderung(en) im Entwurf. Bitte prüfen und übernehmen.`);break;}
    case 'backup': case 'backupshare':{const name=`hoch-runter-backup-${todayISO()}.json`;const txt=backupJSON();
      const ok=a==='backupshare'?await shareFile(name,txt,'application/json'):(await deliverFile(name,txt,'application/json'))==='saved';
      if(ok){S.settings.lastBackup=new Date().toISOString();save();render();toast('Backup erstellt.');}break;}
    case 'csv': case 'csvshare':{const name=`hoch-runter-${todayISO()}.csv`;const txt=csvExport();
      if(a==='csvshare') await shareFile(name,txt,'text/csv'); else await deliverFile(name,txt,'text/csv');break;}
    case 'persist':{try{const ok=navigator.storage&&navigator.storage.persist?await navigator.storage.persist():false;toast(ok?'Speicher ist jetzt geschützt.':'Browser hat abgelehnt. Tipp: App zum Startbildschirm hinzufügen.');}catch(e){toast('Nicht unterstützt.');}checkPersist();break;}
    case 'askwipe': ui.confirm='wipe'; render(); break;
    case 'wipe': S=defaultState(); ui.confirm=null; await saveNow(); render(); toast('Alle Daten gelöscht.'); break;
  }
}

function onBind(el,ev){
  const b=el.dataset.bind, A=S.active; const ei=el.dataset.i!=null?+el.dataset.i:null, si=el.dataset.s!=null?+el.dataset.s:null;
  const v=el.type==='checkbox'?el.checked:el.value;
  switch(b){
    case 'w': case 'r': A.entries[ei].sets[si][b]=parseNum(v); break;
    case 'rir': A.entries[ei].sets[si].rir=v===''?null:+v; break;
    case 'variant': A.entries[ei].variant=v; break;
    case 'enote': A.entries[ei].note=v; break;
    case 'snotes': A.notes=v; break;
    case 'chkwhere': A.check=A.check||{}; A.check.where=v; break;
    case 'chkbw': A.check=A.check||{}; A.check.bw=parseNum(v); break;
    case 'brkto':{if(ev.type!=='change')return;const b=S.breaks.find(x=>x.id===el.dataset.id);if(!v||v<b.from){toast('Das Ende muss nach dem Start liegen.');render();return;}
      const clash=S.breaks.find(o=>o!==b&&!(v<o.from||b.from>o.to));if(clash){toast(`Überschneidet sich mit ${fmtRange(clash.from,clash.to)}.`);render();return;}
      b.to=v;save();render();toast('Zeitraum angepasst.');return;}
    case 'brk': ui.brk[el.dataset.f]=v; if(ev.type==='change'&&el.type==='date') render(); break;
    case 'iv':{const n=v===''?null:parseNum(v);A.entries[ei].iv[el.dataset.f]=n;break;}
    case 'tip':{const it=edT().find(t=>t.id===ui.editTpl).items[+el.dataset.k];const n=parseNum(v);if(n!=null){it.proto={...protoOf(it),[el.dataset.f]:n};}break;}
    case 'sdate': if(v&&v<=todayISO()){A.date=v;if(ev.type==='change')render();} break;
    case 'dname': editDraft().name=v; break;
    case 'dreason': editDraft().reason=v; break;
    case 'tname': edT().find(t=>t.id===ui.editTpl).name=v; break;
    case 'tday': edT().find(t=>t.id===ui.editTpl).weekday=+v; break;
    case 'ti':{const it=edT().find(t=>t.id===ui.editTpl).items[+el.dataset.k];const f=el.dataset.f;
      if(f==='note') it.note=v; else if(f==='targetW'){const n=parseNum(v);if(n==null)delete it.targetW;else it.targetW=n;} else {const n=parseNum(v);if(n!=null)it[f]=n;} break;}
    case 'exf':{const e=S.exercises.find(x=>x.id===el.dataset.id);e[el.dataset.f]=v;if(ev.type==='change'&&el.tagName==='SELECT')render();break;}
    case 'plate':{const n=parseInt(v,10);if(!isNaN(n))S.equipment.plates[el.dataset.w]=n;break;}
    case 'eq':{const f=el.dataset.f;if(f==='items')S.equipment.items=v;else{const n=parseNum(v);if(n!=null)S.equipment[f]=n;}break;}
    case 'calcw': ui.calc.w=v; $('#calcout').innerHTML=calcOut(parseNum(v)); return;
    case 'con': S.constraints[+el.dataset.k].text=v; break;
    case 'conA': S.constraints[+el.dataset.k].active=v; break;
    case 'conH': S.constraints[+el.dataset.k].health=v; break;
    case 'health': S.settings.healthInCoach=v; if(ui.pkg){ui.pkg=coachPackage(ui.coachRange);render();} break;
    case 'reply': ui.reply=v; return;
    case 'cnote': S.coachNote=v; if(ui.pkg) ui.pkg=coachPackage(ui.coachRange); const pk=$('#pkg'); if(pk) pk.value=ui.pkg; break;
    case 'chg': ui.parsed.changes[+el.dataset.k]._off=!v; return;
    case 'set':{const f=el.dataset.f;if(f==='goal'||f==='experience')S.settings[f]=v;else S.settings[f]=parseNum(v);break;}
    case 'theme': S.settings.theme=v||null; applyTheme(); break;
  }
  save();
}
function applyTheme(){const t=S.settings.theme;if(t)document.documentElement.setAttribute('data-theme',t);else if(!window.__hostTheme)document.documentElement.removeAttribute('data-theme');}

async function onImport(file){
  try{const txt=await file.text();const obj=JSON.parse(txt);const r=importData(obj);await saveNow();render();
    toast(r.mode==='restore'?`Backup eingespielt: ${r.sessions} Einheiten.`:`${r.sessions} Einheiten importiert.`);}
  catch(e){toast('Import fehlgeschlagen: '+(e.message||e));}
}

async function boot(){
  window.__hostTheme=document.documentElement.hasAttribute('data-theme');
  let st=null; try{st=await Store.get('state');}catch(e){}
  S=st?migrate(st):defaultState();
  applyTheme();
  try{upgradeIntervals();await saveNow();}catch(e){console.error(e);}
  if(S.active?.ivt&&!S.active.ivt.pausedAt) ivRun();
  document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(el&&!el.disabled){e.preventDefault();onAct(el);}});
  document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role="button"][data-act]')){e.preventDefault();onAct(e.target);}});
  document.addEventListener('input',e=>{if(e.target.dataset.bind)onBind(e.target,e);});
  document.addEventListener('change',e=>{if(e.target.id==='impfile'&&e.target.files[0]){onImport(e.target.files[0]);e.target.value='';return;}if(e.target.dataset.bind&&(e.target.tagName==='SELECT'||e.target.type==='checkbox'||e.target.type==='date'))onBind(e.target,e);});
  $('#rest-m').onclick=()=>{restEnd-=15000;tickRest();}; $('#rest-p').onclick=()=>{restEnd+=15000;tickRest();}; $('#rest-x').onclick=stopRest;
  window.addEventListener('hashchange',routeFromHash);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')saveNow();});
  routeFromHash();
}
boot();

</script>
<script>if('serviceWorker' in navigator && location.protocol==='https:'){navigator.serviceWorker.register('sw.js').then(r=>{r.addEventListener('updatefound',()=>{const n=r.installing;n&&n.addEventListener('statechange',()=>{if(n.state==='installed'&&navigator.serviceWorker.controller){const t=document.createElement('div');t.className='toast';t.innerHTML='Neue Version geladen. <u>Neu laden</u>';t.style.cursor='pointer';t.onclick=()=>location.reload();document.body.appendChild(t);}});});}).catch(()=>{});}</script>
